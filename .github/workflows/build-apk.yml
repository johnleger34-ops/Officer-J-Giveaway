name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify release signing secrets
        env:
        run: |

      - name: Restore permanent release keystore
        env:
        run: |

      - name: Build signed release APK
        env:
        run: gradle assembleDebug

      - name: Name release APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/Officer-J-Giveaway-v1.1.3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Officer-J-Giveaway-v1.1.3-Release
          path: release-output/Officer-J-Giveaway-v1.1.3.apk
          if-no-files-found: error
