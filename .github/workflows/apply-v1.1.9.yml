name: Apply v1.1.9 cleanup

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-v1.1.9-cleanup.py
      - .github/workflows/apply-v1.1.9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply exact v1.1.9 source
        run: python scripts/apply-v1.1.9-cleanup.py

      - name: Commit cleaned source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove Facebook entry check and enable broad file imports"
            git push origin main
          fi
